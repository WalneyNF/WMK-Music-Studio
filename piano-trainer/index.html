<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMK Piano Trainer</title><style>body{background:#101522;color:#eee;font:16px system-ui;margin:20px}button,select,input{font:inherit;margin:5px;padding:8px}canvas{width:100%;background:#080d18;display:block}#keys{display:flex;position:relative;height:130px}.white{flex:1;background:white;color:#111;margin:0;border:1px solid #999;padding:0;display:flex;align-items:end;justify-content:center}.black{position:absolute;background:#222;color:white;height:60%;margin:0;padding:0;z-index:2}.target{background:#24a76a!important;color:white}small{color:#aaa}</style><h1>WMK Piano Trainer · v0.1</h1><select id="lesson"><option>Escala de Dó</option><option>Escala descendente</option><option>Melodia original</option></select><button id="play">Demonstração</button><button id="stop">Reiniciar</button><button id="export">Exportar MIDI</button><label>BPM <input id="bpm" type="number" min="40" max="200" value="80"></label><p id="status"></p><canvas id="roll" width="700" height="260"></canvas><div id="keys"></div><p><small>Walney Moreira Klein — walneyk@hotmail.com</small></p><script src="../studio/music-core.js"></script><script>
const $=id=>document.getElementById(id),white=[60,62,64,65,67,69,71,72],black=[61,63,66,68,70],names=['Dó','Dó♯','Ré','Ré♯','Mi','Fá','Fá♯','Sol','Sol♯','Lá','Lá♯','Si'],lessons=[white,[...white].reverse(),[60,64,67,64,62,65,69,65,67,64,60]],buttons=new Map(),g=$('roll').getContext('2d');let seq=lessons[0],idx=0,errors=0,ac,timer=null,playing=false;
const x=n=>white.includes(n)?(white.indexOf(n)+.5)*87.5:(white.indexOf(n-1)+1)*87.5;
function tempo(){return Math.max(40,Math.min(200,Number($('bpm').value)||80))}
function sound(n){ac=ac||new AudioContext();ac.resume();const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.value=440*2**((n-69)/12);v.gain.setValueAtTime(.12,t);v.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(v).connect(ac.destination);o.start();o.stop(t+.46)}
function draw(){g.clearRect(0,0,700,260);g.strokeStyle='#283449';for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*87.5,0);g.lineTo(i*87.5,260);g.stroke()}for(let i=idx;i<Math.min(seq.length,idx+6);i++){g.fillStyle=i===idx?'#24a76a':'#7863d6';g.fillRect(x(seq[i])-23,218-(i-idx)*40,46,36);g.fillStyle='white';g.font='14px sans-serif';g.textAlign='center';g.fillText(names[seq[i]%12],x(seq[i]),240-(i-idx)*40)}buttons.forEach((b,n)=>b.classList.toggle('target',n===seq[idx]));$('status').textContent=(idx===seq.length?'Concluído!':'Próxima nota: '+names[seq[idx]%12])+' | Progresso '+idx+'/'+seq.length+' | Erros '+errors}
function press(n){if(playing)return;sound(n);if(idx<seq.length){if(n===seq[idx])idx++;else errors++}draw()}
function key(n,c){const b=document.createElement('button');b.className=c;b.textContent=names[n%12];b.onclick=()=>press(n);$('keys').append(b);buttons.set(n,b);return b}
white.forEach(n=>key(n,'white'));black.forEach(n=>{let b=key(n,'black');b.style.left=(x(n)/7-3.5)+'%';b.style.width='7%'});
function reset(){clearTimeout(timer);playing=false;idx=errors=0;draw()}
$('stop').onclick=reset;$('lesson').onchange=()=>{seq=lessons[$('lesson').selectedIndex];reset()};$('play').onclick=()=>{reset();playing=true;function step(){if(idx>=seq.length){playing=false;return}sound(seq[idx++]);draw();timer=setTimeout(step,60000/tempo())}step()};
$('export').onclick=()=>{const bytes=WMKMusic.midi({bpm:tempo(),faixas:[{canal:0,programa:0,notas:seq.map((midi,inicio)=>({midi,inicio,duracao:.85,velocity:90}))}]});const url=URL.createObjectURL(new Blob([bytes],{type:'audio/midi'})),a=document.createElement('a');a.href=url;a.download='wmk-exercicio.mid';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.addEventListener('keydown',e=>{if(e.repeat||['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;let i='asdfghjk'.indexOf(e.key.toLowerCase());if(i>=0)press(white[i])});draw();
</script></html>
