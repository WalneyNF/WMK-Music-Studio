<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WMK Compositor</title><style>body{background:#141722;color:#eee;font:16px system-ui;max-width:960px;margin:30px auto;padding:16px}textarea,input,select,button{font:inherit;background:#252b3b;color:white;border:1px solid #586079;border-radius:6px;padding:10px;box-sizing:border-box}textarea,input{width:100%}textarea{min-height:140px}button{cursor:pointer;margin:5px}label{display:block;margin:12px 0}#keys{display:flex}#keys button{flex:1;background:white;color:black;margin:1px;height:90px;padding:2px}#keys button.on{background:#80e6b0}small{color:#aaa}</style><h1>WMK Compositor · 0.1</h1><p>Crie letras e experimente harmonias sem instalar modelos de IA.</p><label>Título<input id="title"></label><label>Letra<textarea id="lyrics" placeholder="[Verso]&#10;[Refrão]"></textarea></label><label>Progressão (um acorde por compasso)<input id="chords" value="C G Am F"></label><label>BPM<input id="bpm" type="number" min="40" max="220" value="100"></label><button id="play">Ouvir progressão</button><button id="stop">Parar</button><button id="save">Exportar projeto JSON</button><label>Importar projeto JSON<input type="file" id="load" accept=".json"></label><p id="status" role="status"></p><div id="keys"></div><p><a href="../academy/index.html" style="color:#9cf">Academia musical</a></p><small>Walney Moreira Klein — walneyk@hotmail.com</small><script>
const $=id=>document.getElementById(id), names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], flats={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};let ctx,timer,voices=[],generation=0;
function parse(s){const m=/^([A-G][#b]?)(maj7|m7|m|7|dim|sus4)?$/.exec(s);if(!m)throw Error('Acorde inválido: '+s);const r=names.indexOf(flats[m[1]]||m[1]);if(r<0)throw Error('Nota inválida');return ({'':[0,4,7],m:[0,3,7],7:[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],dim:[0,3,6],sus4:[0,5,7]}[m[2]||'']).map(n=>60+r+n)}
for(let n=60;n<84;n++){let b=document.createElement('button');b.textContent=names[n%12];b.dataset.n=n;b.onclick=async()=>{await audio();sound([n],.4)};$('keys').append(b)}
async function audio(){ctx=ctx||new AudioContext();await ctx.resume()}
function sound(ns,d){for(const n of ns){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.value=440*2**((n-69)/12);g.gain.setValueAtTime(.1/ns.length,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);voices.push(o);o.onended=()=>{voices=voices.filter(v=>v!==o)};o.start();o.stop(t+d)}}
function stop(){generation++;clearTimeout(timer);for(const o of voices){try{o.stop()}catch{}}voices=[];document.querySelectorAll('#keys button').forEach(b=>b.classList.remove('on'))}
function project(){const bpm=Number($('bpm').value),chords=$('chords').value.trim().split(/\s+/);if(!Number.isFinite(bpm)||bpm<40||bpm>220)throw Error('BPM entre 40 e 220');chords.forEach(parse);return {version:1,title:$('title').value,lyrics:$('lyrics').value,bpm,chords}}
$('play').onclick=async()=>{stop();const id=generation;try{const p=project();await audio();if(id!==generation)return;let i=0;function step(){if(id!==generation)return;if(i>=p.chords.length){stop();$('status').textContent='Fim da progressão';return}let c=p.chords[i++],ns=parse(c),d=240/p.bpm;document.querySelectorAll('#keys button').forEach(b=>b.classList.toggle('on',ns.includes(Number(b.dataset.n))));$('status').textContent=c+' — '+ns.map(n=>names[n%12]).join(' + ');sound(ns,d*.95);timer=setTimeout(step,d*1000)}step()}catch(e){$('status').textContent=e.message}};
$('stop').onclick=()=>{stop();$('status').textContent='Parado'};
$('save').onclick=()=>{try{const u=URL.createObjectURL(new Blob([JSON.stringify(project(),null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='composicao.wmk.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){$('status').textContent=e.message}};
$('load').onchange=async()=>{try{const f=$('load').files[0];if(!f)return;const p=JSON.parse(await f.text());if(p.version!==1||typeof p.title!=='string'||typeof p.lyrics!=='string'||!Array.isArray(p.chords)||!p.chords.length||!Number.isFinite(p.bpm)||p.bpm<40||p.bpm>220)throw Error('Projeto inválido');p.chords.forEach(parse);stop();$('title').value=p.title;$('lyrics').value=p.lyrics;$('bpm').value=p.bpm;$('chords').value=p.chords.join(' ');$('status').textContent='Projeto importado'}catch(e){$('status').textContent=e.message}};
</script></html>
